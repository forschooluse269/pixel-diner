<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 식당</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #1d1410; color: #fff3e0;
         font-family: monospace, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; }
  @supports (height: 100dvh) { body { height: 100dvh; } }

  /* These widths are the starting size. The script resizes them so everything fits the window. */
  #hud { width: min(96vw, 640px); display: flex; justify-content: space-between;
         align-items: center; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; padding: 4px 2px; }
  #stage { position: relative; width: min(96vw, 640px); }
  #stage canvas { display: block; box-sizing: border-box; width: 100%; aspect-ratio: 4 / 3;
                  image-rendering: pixelated; border: 4px solid #5a3b2e; background: #000; }
  #help { width: min(96vw, 640px); font-size: 12px; opacity: 0.8; margin-top: 6px; text-align: center; }

  #err { position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: #b00020;
         color: #fff; padding: 10px; font: 14px monospace; }
  #toast { position: fixed; right: 10px; bottom: 10px; z-index: 50; background: #1d1410;
           border: 2px solid #ffd28a; padding: 6px 10px; font-size: 13px; opacity: 0;
           transition: opacity 0.3s; pointer-events: none; max-width: 80vw; }

  #dialog { position: absolute; left: 2%; right: 2%; bottom: 3%; height: 36%;
            box-sizing: border-box; background: #1d1410; border: 4px solid #ffd28a;
            box-shadow: 0 0 0 4px #5a3b2e; padding: 1.1em 1.4em; cursor: pointer;
            display: flex; flex-direction: column; }
  #nameplate { position: absolute; top: -1.5em; left: 1em; background: #ffd28a; color: #1d1410;
               font-weight: bold; padding: 0.15em 0.9em; }
  #dtext { line-height: 1.5; flex: 1; overflow: hidden; }
  #dnext { position: absolute; right: 1em; bottom: 0.4em; color: #ffd28a;
           animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #skipBtn { position: absolute; top: 12px; right: 12px; z-index: 3; }

  .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.8);
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; justify-content: safe center;
             gap: 10px; padding: 12px; box-sizing: border-box; text-align: center; overflow: auto; }
  .overlay h1 { margin: 0; font-size: 30px; }
  .overlay p { margin: 0; max-width: 460px; font-size: 14px; line-height: 1.4; }
  @media (max-height: 640px) {
    .overlay h1 { font-size: 24px; }
    .overlay p { font-size: 13px; }
    .overlay { gap: 8px; }
  }
  #overlay { z-index: 5; }
  #admin { z-index: 8; }
  #settings { z-index: 10; }
  .hidden { display: none !important; }
  button { font-family: inherit; font-weight: bold; font-size: 16px; padding: 8px 16px; border: 0;
           background: #ffd28a; cursor: pointer; }
  button.small { font-size: 13px; padding: 5px 10px; }
  button.active { outline: 3px solid #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #quit { background: #ff8a80; }
  label.check { font-size: 15px; cursor: pointer; }
  .note { font-size: 13px; opacity: 0.7; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; max-width: 520px; }
</style>
</head>
<body>
<div id="hud">
  <span id="dayInfo"></span>
  <span><span data-i18n="score">점수</span>: <strong id="score">0</strong></span>
  <span><span data-i18n="served">서빙</span>: <strong id="served">0</strong></span>
  <span id="lives" style="color:#ff6b5e"></span>
  <span>
    <button class="small" id="gear" onclick="gearClick()" data-i18n="settings">설정</button>
    <button class="small" id="quit" onclick="quitShift()" style="visibility:hidden" data-i18n="quit">그만두기</button>
  </span>
</div>

<div id="stage">
  <canvas id="c" width="320" height="240"></canvas>
  <button class="small hidden" id="skipBtn" onclick="skipScene()" data-i18n="skip">건너뛰기</button>
  <div id="dialog" class="hidden">
    <div id="nameplate"></div>
    <div id="dtext"></div>
    <div id="dnext">&#9660;</div>
  </div>
</div>

<div id="help" data-i18n="help"></div>

<!-- Menu / results screen. These buttons work straight from the HTML. -->
<div id="overlay" class="overlay">
  <h1 id="title">픽셀 식당</h1>
  <p id="sub"></p>
  <div class="buttons" id="menuButtons">
    <button onclick="showStorySelect()">스토리 모드</button>
    <button onclick="showEndlessSelect()">무한 모드</button>
    <button onclick="openSettings()">설정</button>
  </div>
  <p class="note" id="status">게임을 불러오는 중...</p>
</div>

<!-- Admin menu (type a-d-m-i-n on the main menu to open it) -->
<div id="admin" class="overlay hidden">
  <h1 data-i18n="adminTitle"></h1>
  <p class="note" data-i18n="adminNote"></p>
  <p data-i18n="adminStory"></p>
  <div class="buttons" id="adminStories"></div>
  <p data-i18n="adminDay"></p>
  <div class="buttons" id="adminDays"></div>
  <div class="buttons">
    <button onclick="adminPlay('before')" data-i18n="adminBefore"></button>
    <button onclick="adminPlay('after')" data-i18n="adminAfter"></button>
    <button onclick="adminPlay('day')" data-i18n="adminPlay"></button>
  </div>
  <div class="buttons">
    <span data-i18n="adminSpeed"></span>
    <input type="range" id="adminSpeed" min="20" max="240" step="5" oninput="setAdminSpeed(this.value)">
    <strong id="adminSpeedVal"></strong>
    <button class="small" onclick="adminResetSpeed()" data-i18n="adminReset"></button>
  </div>
  <div class="buttons">
    <button onclick="closeAdmin()" data-i18n="adminClose"></button>
  </div>
</div>

<!-- Settings screen -->
<div id="settings" class="overlay hidden">
  <h1 data-i18n="settingsTitle">설정</h1>
  <div class="buttons">
    <span data-i18n="language">언어</span>
    <button class="small" data-l="ko" onclick="setLanguage('ko')">한국어</button>
    <button class="small" data-l="en" onclick="setLanguage('en')">English</button>
  </div>
  <div class="buttons" id="difficulty">
    <button class="small" data-d="easy" onclick="setDifficulty('easy')" data-i18n="easy">쉬움</button>
    <button class="small" data-d="normal" onclick="setDifficulty('normal')" data-i18n="normal">보통</button>
    <button class="small" data-d="hard" onclick="setDifficulty('hard')" data-i18n="hard">어려움</button>
  </div>
  <p id="diffInfo"></p>
  <p class="note" data-i18n="diffNote"></p>
  <label class="check"><input type="checkbox" id="sound" onchange="setSound(this.checked)"> <span data-i18n="sound"></span></label>
  <label class="check"><input type="checkbox" id="prompt" onchange="setPrompt(this.checked)"> <span data-i18n="prompt"></span></label>
  <div class="buttons">
    <button class="small" onclick="exportSave()" data-i18n="copySave"></button>
    <button class="small" onclick="importSave()" data-i18n="loadSave"></button>
    <button class="small" onclick="resetProgress()" data-i18n="resetProgress"></button>
  </div>
  <p class="note" data-i18n="saveNote"></p>
  <div class="buttons">
    <button id="doneBtn" onclick="closeSettings()" data-i18n="ok">확인</button>
  </div>
</div>

<div id="toast"></div>
<div id="err" class="hidden"></div>

<!-- Error catcher: shows any problem in a red bar at the top of the page -->
<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("err");
    box.textContent = "Error: " + e.message + " (line " + e.lineno + ")";
    box.classList.remove("hidden");
  });
</script>

  // ----- How each dish is drawn from the list of ingredients. cx = center x, by = bottom y -----
  function dishBurger(list, cx, by) {
    var B = "#d9a05b";
    var y = by;
    rect(B, cx - 6, y - 2, 12, 2); y -= 2;                       // bottom bun
    list.forEach(function (k) { rect(FOOD[k], cx - 6, y - 2, 12, 2); y -= 2; });
    rect(B, cx - 6, y - 2, 12, 2);                               // top bun
    rect(B, cx - 5, y - 3, 10, 1);
    rect(B, cx - 3, y - 4, 6, 1);
    rect("#fff3c4", cx - 2, y - 3, 1, 1);                        // sesame seeds
    rect("#fff3c4", cx + 1, y - 2, 1, 1);
  }

  function dishKimbap(list, cx, by) {
    var h = 2 * list.length + 4;
    rect("#1f2d22", cx - 6, by - h, 12, h);                      // seaweed wrapper
    rect("#f4f1e6", cx - 5, by - 2, 10, 2);                      // bottom rice
    var y = by - 2;
    list.forEach(function (k) { rect(FOOD[k], cx - 5, y - 2, 10, 2); y -= 2; });
    rect("#f4f1e6", cx - 5, y - 2, 10, 2);                       // top rice
  }

  function dishPizza(list, cx, by) {
    rect("#d9a05b", cx - 7, by - 2, 14, 2);                      // crust
    rect("#b9782f", cx - 7, by - 2, 1, 2);
    rect("#b9782f", cx + 6, by - 2, 1, 2);
    var y = by - 2;
    list.forEach(function (k, i) {
      var w = Math.max(4, 12 - i * 2);                           // layers get narrower, like a slice
      rect(FOOD[k], cx - w / 2, y - 2, w, 2);
      y -= 2;
    });
  }

  function dishChicken(list, cx, by) {
    rect("#c8102e", cx - 6, by - 4, 12, 4);                      // bucket
    rect("#ffffff", cx - 4, by - 4, 2, 4);
    rect("#ffffff", cx, by - 4, 2, 4);
    rect("#ffffff", cx + 4, by - 4, 2, 4);
    rect("#8c0a1f", cx - 7, by - 5, 14, 1);                      // rim
    var y = by - 5;
    list.forEach(function (k) { rect(FOOD[k], cx - 5, y - 2, 10, 2); y -= 2; });
  }

  // =====================================================================
  //  SOUND (tiny beeps, no files needed)
  // =====================================================================
  function beep(freq, dur, type, vol) {
    if (!S.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.value = vol || 0.04;
      o.connect(g); g.connect(audio.destination);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    add:   function () { beep(520, 0.07); },
    trash: function () { beep(200, 0.12, "triangle"); },
    good:  function () { beep(660, 0.1); setTimeout(function () { beep(880, 0.15); }, 90); },
    wrong: function () { beep(140, 0.18, "sawtooth"); },
    angry: function () { beep(90, 0.3, "sawtooth", 0.06); }
  };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function rect(color, x, y, w, h) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function sprite(rows, pal, x, y, flip) {
    var w = rows[0].length;
    for (var j = 0; j < rows.length; j++) {
      for (var i = 0; i < w; i++) {
        var ch = rows[j].charAt(flip ? w - 1 - i : i);
        if (ch !== ".") rect(pal[ch], x + i, y + j, 1, 1);
      }
    }
  }

  // Same as sprite() but each pixel is s x s (used for the big cutscene portrait)
  function spriteScaled(rows, pal, x, y, s) {
    for (var j = 0; j < rows.length; j++) {
      for (var i = 0; i < rows[j].length; i++) {
        var ch = rows[j].charAt(i);
        if (ch !== ".") rect(pal[ch], x + i * s, y + j * s, s, s);
      }
    }
  }

    ctx.fillText(str, Math.round(x), Math.round(y));

  function reset() {

  // Saves your best endless score. Returns true if it is a new record
  function recordBest() {
    if (runType === "endless" && served > S.best[curRid]) {
      S.best[curRid] = served;
      saveSettings();
      return true;
    }
    return false;
  }

  // Quit: you lose all your lives and go back to the main menu
  function quitShift() {
    if (mode !== "play") return;
    recordBest();
    lives = 0;
    customers = [null, null, null];
    tray = [];
    floaters = [];
    showMenu();
  }

  function spawnCustomer() {
    var free = [];
    customers.forEach(function (c, i) { if (!c) free.push(i); });
    if (!free.length) return;
    var len = 2 + Math.floor(Math.random() * 3);              // 2 to 4 ingredients
    var order = [];
    for (var n = 0; n < len; n++) order.push(pick(R.foods));
    // Burger restaurant: every burger gets at least one patty
    if (R.mustHave && order.indexOf(R.mustHave) < 0) {
      order[Math.floor(Math.random() * order.length)] = R.mustHave;
    }
    // Patience shrinks as you serve more, but never below 60% of the starting value
    var total = Math.max(cfg.patience * 600, cfg.patience * 1000 - served * 1000);
    customers[pick(free)] = {
      order: order, patience: 1, drain: 1 / total,
      hair: pick(HAIRS), shirt: pick(SHIRTS), t: Math.random() * 6
    };
  }

  // Finds the closest station or occupied table within reach
  function nearest() {
    var cx = p.x + 5, cy = p.y + 7;
    var best = null, bd = 36;
    STATIONS.forEach(function (s) {
      var d = Math.hypot(cx - (s.x + 24), cy - 222);
      if (d < bd) { bd = d; best = { s: s }; }
    });
    customers.forEach(function (c, i) {
      if (!c) return;
      var d = Math.hypot(cx - TABLES[i], cy - 69);
      if (d < bd) { bd = d; best = { c: c, i: i }; }
    });
    return best;
  }

  function interact() {
    var tg = nearest();
    if (!tg) return;
    if (tg.s) {
      if (tg.s.kind === "trash") { tray = []; sfx.trash(); }
      else if (tray.length < 4) { tray.push(tg.s.kind); sfx.add(); }
      else addFloater(p.x + 5, p.y - 4, t("trayFull"), "#ffffff");
    } else {
      var tx = TABLES[tg.i];
      if (!tray.length) {
        addFloater(tx, 50, t("bringFood"), "#ffffff");
      } else if (tray.join() === tg.c.order.join()) {
        var pts = 10 + Math.round(tg.c.patience * 10);   // faster service = more points
        score += pts; served++;
        customers[tg.i] = null; tray = [];
        addFloater(tx, 50, "+" + pts, "#7ddc7d");
        sfx.good();
        if (runType === "story" && served >= goal()) winShift();
      } else {
        addFloater(tx, 50, t("wrongOrder"), "#ffd24d");
        sfx.wrong();
      }
    }
  }

  function update(dt) {
    var speed = adminUnlocked ? adminSpeed : SPEED;   // the admin menu can change your walking speed
    var dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    var dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    p.moving = (dx !== 0 || dy !== 0);
    if (p.moving) {
      var len = Math.hypot(dx, dy);
      p.x += (dx / len) * speed * dt / 1000;
      p.y += (dy / len) * speed * dt / 1000;
      if (dx) p.dir = dx;
      p.step += dt / 1000 * 8;
    }
    p.x = clamp(p.x, 2, W - 12);
    p.y = clamp(p.y, 84, 190);

    spawnT += dt;
    var every = Math.max(cfg.spawn * 550, cfg.spawn * 1000 - served * 150);
    if (spawnT >= every) { spawnT = 0; spawnCustomer(); }

    customers.forEach(function (c, i) {
      if (!c || mode !== "play") return;
      c.patience -= c.drain * dt;
      c.t += dt / 1000;
      if (c.patience <= 0) {
        customers[i] = null;
        lives--;
        addFloater(TABLES[i], 50, t("angry"), "#ff6b5e");
        sfx.angry();
        if (lives <= 0) gameOver();
      }
    });
    floaters = floaters.filter(function (f) { f.life -= dt; return f.life > 0; });
  }

  function gameOver() {
    mode = "menu";
    newBest = recordBest();
    showGameOver();
  }

  function showGameOver() {
    mode = "menu";
    rebuild = showGameOver;
    var msg;
    if (runType === "story") msg = t("failStory", served, goal());
    else msg = t("result", served, score) + " " + (newBest ? t("newBest") : t("best", S.best[curRid]));
    var items = [{ label: runType === "story" ? t("tryAgain") : t("playAgain"), fn: startShift }];
    if (testRun) items.push({ label: t("adminBtn"), fn: openAdmin });
    items.push({ label: t("mainMenu"), fn: showMenu });
    showOverlay(t("shiftOver"), msg, items);
  }

  // A story day is finished: save progress, play the "after" scene, then show the results
  function winShift() {
    var id = storyId, thisDay = dayNo;
    var lines = L(STORIES[id].days[thisDay - 1].after[S.lang]);
    if (testRun) {                                   // admin test: don't touch saved progress
      playScene(lines, openAdmin);
      return;
    }
    if (thisDay > S.progress[id]) { S.progress[id] = thisDay; saveSettings(); }
    playScene(lines, function () { showDayResult(id, thisDay); });
  }

  function showDayResult(id, thisDay) {
    mode = "menu";
    rebuild = function () { showDayResult(id, thisDay); };
    var result = t("result", served, score);
    var items = [];
    if (thisDay < 5) {
      items.push({ label: t("nextDay"), fn: function () { startStory(id, thisDay + 1); } });
      items.push({ label: t("replayDay"), fn: startShift });
      items.push({ label: t("mainMenu"), fn: showMenu });
      showOverlay(t("dayDone", thisDay), result, items);
    } else {
      items.push({ label: t("replayStory"), fn: function () { startStory(id, 1); } });
      items.push({ label: t("mainMenu"), fn: showMenu });
      showOverlay(t("storyDone"), t("storyDoneSub", t("story_" + id), result), items);
    }
  }

  // =====================================================================
  //  CUTSCENES
  // =====================================================================
  function fitDialog() {
    $("dialog").style.fontSize = ($("stage").clientWidth * 0.03) + "px";
  }

  function playScene(lines, onEnd) {
    scene = { lines: lines, i: 0, shown: 0, onEnd: onEnd, look: STORIES[storyId].look, boss: t("boss_" + storyId) };
    mode = "scene";
    paused = false;
    $("overlay").style.display = "none";
    $("dialog").classList.remove("hidden");
    $("skipBtn").classList.remove("hidden");
    fitDialog();
    showLine();
  }

  function showLine() {
    var l = scene.lines[scene.i];
    var np = $("nameplate");
    np.textContent = l.who === "boss" ? scene.boss : t("you");
    np.style.left = l.who === "boss" ? "auto" : "1em";     // nameplate sits on the speaker's side
    np.style.right = l.who === "boss" ? "1em" : "auto";
    scene.shown = 0;
    $("dtext").textContent = "";
    $("dnext").style.visibility = "hidden";
  }

  function updateScene(dt) {
    if (!scene) return;
    var l = scene.lines[scene.i];
    if (scene.shown < l.text.length) scene.shown = Math.min(l.text.length, scene.shown + dt * 0.045);
    $("dtext").textContent = l.text.slice(0, Math.floor(scene.shown));
    $("dnext").style.visibility = scene.shown >= l.text.length ? "visible" : "hidden";
  }

  function advanceScene() {
    if (!scene) return;
    var l = scene.lines[scene.i];
    if (scene.shown < l.text.length) { scene.shown = l.text.length; return; }   // finish typing first
    scene.i++;
    if (scene.i >= scene.lines.length) endScene();
    else showLine();
  }

  function endScene() {
    var done = scene && scene.onEnd;
    scene = null;
    $("dialog").classList.add("hidden");
    $("skipBtn").classList.add("hidden");
    mode = "menu";
    if (done) done();
  }

  function skipScene() {
    $("skipBtn").blur();
    endScene();
  }

  $("stage").addEventListener("pointerdown", function (e) {
    if (mode === "scene" && e.target.id !== "skipBtn") advanceScene();
  });
  window.addEventListener("resize", fitScreen);

  // =====================================================================
  //  DRAWING: office cutscene
  // =====================================================================
  function drawOffice() {
    var O = R.office;
    rect(O.wall, 0, 0, W, 112);                    // wall
    rect(O.wain, 0, 96, W, 16);                    // lower wall panel
    rect("rgba(0,0,0,0.2)", 0, 96, W, 2);
    for (var y = 112; y < H; y += 12)              // floor
      rect(y % 24 === 0 ? O.fa : O.fb, 0, y, W, 12);
    // Window
    rect("#3d2b1f", 118, 14, 84, 64);
    rect("#9ad4f5", 121, 17, 78, 58);
    rect("#3d2b1f", 158, 17, 4, 58);
    rect("#3d2b1f", 121, 44, 78, 4);
    rect("#ffffff", 126, 24, 14, 4); rect("#ffffff", 130, 22, 8, 2);
    rect("#ffffff", 172, 52, 16, 4);
    // Framed certificate
    rect("#3d2b1f", 24, 16, 40, 28);
    rect("#fff3e0", 26, 18, 36, 24);
    rect("#bbbbbb", 30, 24, 28, 2);
    rect("#bbbbbb", 30, 30, 28, 2);
    rect("#c0392b", 48, 35, 8, 4);
  }

  function drawDesk() {
    rect("#7b5236", 196, 108, 124, 8);
    rect("#4a2f1f", 196, 116, 124, 40);
    rect("#ffd28a", 226, 110, 22, 4);              // gold nameplate
    rect("#f5f5f5", 274, 105, 16, 3);              // stack of papers
    rect("#d9d9d9", 276, 102, 16, 3);
  }

  // The bosses, drawn from colored blocks. s = size of one block in pixels
  function drawBoss(look, x, y, s, talking) {
    function B(c, ux, uy, uw, uh) { rect(c, x + ux * s, y + uy * s, uw * s, uh * s); }
    if (look === "humble") {                       // Mr. Kim: kind and smiling
      B("#e8e0cf", 2, 10, 12, 14);                 // cream shirt
      B("#c9a36a", 4, 11, 8, 13);                  // apron
      B("#c9a36a", 6, 10, 4, 1);
      B(SKIN, 6, 9, 4, 1);                         // neck
      B(SKIN, 4, 1, 8, 8);                         // face
      B(SKIN, 3, 4, 1, 2); B(SKIN, 12, 4, 1, 2);   // ears
      B("#e8e8e8", 3, 2, 1, 4); B("#e8e8e8", 12, 2, 1, 4);     // white hair
      B("#ffffff", 4, 0, 8, 2);                    // cook's cap
      B("#6b5a4a", 5, 3, 2, 1); B("#6b5a4a", 9, 3, 2, 1);      // soft eyebrows
      B("#222222", 6, 5, 1, 1); B("#222222", 9, 5, 1, 1);      // eyes
      B("#f0a99a", 5, 6, 1, 1); B("#f0a99a", 10, 6, 1, 1);     // rosy cheeks
      B("#e0a98a", 7, 6, 2, 1);                    // nose
      B("#5a1f1f", 6, 7, 1, 1); B("#5a1f1f", 9, 7, 1, 1);      // smile corners
      B("#5a1f1f", 7, 8, 2, talking ? 2 : 1);      // mouth
    } else if (look === "lazy") {                  // Vinny: sleepy and unbothered
      B("#ececec", 2, 10, 12, 14);                 // chef coat
      B("#c0392b", 5, 13, 2, 2);                   // sauce stain
      B("#bbbbbb", 8, 12, 1, 1); B("#bbbbbb", 8, 15, 1, 1);    // buttons
      B(SKIN, 6, 9, 4, 1);
      B(SKIN, 4, 1, 8, 8);
      B(SKIN, 3, 4, 1, 2); B(SKIN, 12, 4, 1, 2);
      B("#2a1b12", 3, 3, 1, 3); B("#2a1b12", 12, 3, 1, 3);     // messy hair
      B("#2a1b12", 5, 1, 6, 1);
      B("#ffffff", 5, 0, 8, 2); B("#ffffff", 3, 1, 3, 1);      // droopy chef hat
      B("#2a1b12", 5, 3, 2, 1); B("#2a1b12", 9, 3, 2, 1);      // flat eyebrows
      B("#d9a07a", 5, 4, 2, 1); B("#d9a07a", 9, 4, 2, 1);      // heavy eyelids
      B("#222222", 5, 5, 2, 1); B("#222222", 9, 5, 2, 1);      // half-closed eyes
      B("#e0a98a", 7, 6, 2, 1);
      B("#2a1b12", 5, 7, 6, 1);                    // mustache
      B("#5a1f1f", 7, 8, 2, talking ? 2 : 1);
    } else if (look === "greedy") {                // Earl: loves money
      B("#2e7d32", 2, 10, 12, 14);                 // green suit
      B("#f4f4f4", 6, 10, 4, 5);                   // white shirt
      B("#c0392b", 6, 10, 4, 1);                   // bow tie
      B("#ffd23f", 5, 13, 6, 1);                   // gold chain
      B("#ffd23f", 4, 16, 1, 1); B("#ffd23f", 11, 16, 1, 1);   // gold buttons
      B(SKIN, 6, 9, 4, 1);
      B(SKIN, 4, 1, 8, 8);
      B(SKIN, 3, 4, 1, 2); B(SKIN, 12, 4, 1, 2);
      B("#222222", 5, -3, 6, 3);                   // top hat
      B("#ffd23f", 5, -1, 6, 1);                   // gold hat band
      B("#222222", 3, 0, 10, 1);                   // hat brim
      B("#6b5a4a", 5, 3, 2, 1); B("#6b5a4a", 9, 3, 2, 1);      // eyebrows
      B("#ffd23f", 5, 4, 2, 2); B("#ffd23f", 9, 4, 2, 2);      // gold coin eyes
      B("#b8860b", 6, 5, 1, 1); B("#b8860b", 9, 5, 1, 1);
      B("#e0a98a", 7, 6, 2, 1);                    // nose
      B("#f0f0f0", 5, 7, 6, 1);                    // white mustache
      B("#5a1f1f", 6, 8, 4, talking ? 2 : 1);      // grin
      B("#ffd23f", 7, 8, 1, 1);                    // gold tooth
    } else {                                       // the bossy burger boss
      B("#2a3448", 2, 10, 12, 14);                 // suit
      B("#3d4a63", 3, 10, 10, 14);
      B("#ffffff", 6, 10, 4, 5);                   // shirt
      B("#c0392b", 7, 10, 2, 7);                   // tie
      B("#2a3448", 5, 10, 1, 4); B("#2a3448", 10, 10, 1, 4);   // lapels
      B(SKIN, 6, 9, 4, 1);                         // neck
      B(SKIN, 4, 1, 8, 8);                         // face
      B(SKIN, 3, 4, 1, 2); B(SKIN, 12, 4, 1, 2);   // ears
      B("#8a8a8a", 3, 3, 1, 3); B("#8a8a8a", 12, 3, 1, 3);     // side hair
      B("#8a8a8a", 5, 1, 6, 1);                    // thin hair on top
      B("#3a2a20", 5, 3, 2, 1); B("#3a2a20", 7, 4, 1, 1);      // angry eyebrows
      B("#3a2a20", 9, 4, 1, 1); B("#3a2a20", 10, 3, 2, 1);
      B("#222222", 6, 5, 1, 1); B("#222222", 9, 5, 1, 1);      // eyes
      B("#e0a98a", 7, 6, 2, 1);                    // nose
      B("#5a3b2e", 6, 7, 4, 1);                    // mustache
      B("#5a1f1f", 7, 8, 2, talking ? 2 : 1);      // mouth
    }
  }

  function drawScene() {
    drawOffice();
    if (!scene) return;
    var l = scene.lines[scene.i];
    var typing = scene.shown < l.text.length;
    if (l.who === "boss") {
      drawBoss(scene.look, 228, 32, 5, typing && Math.floor(performance.now() / 110) % 2 === 0);
    } else {
      rect("rgba(0,0,0,0.2)", 34, 138, 54, 4);
      spriteScaled(PLAYER_BODY, PLAYER_PAL, 36, 80, 5);
    }
    drawDesk();
  }

  // =====================================================================
  //  DRAWING: restaurant
  // =====================================================================
  function drawCustomer(c, i) {
    var x = TABLES[i] - 5;
    var y = 48 + Math.round(Math.sin(c.t * 2) * 0.6);
    sprite(CUSTOMER, { h: c.hair, s: SKIN, c: c.shirt, k: "#222222" }, x, y);
    if (c.patience > 0.6) {
      rect("#222", x + 3, y + 4, 1, 1); rect("#222", x + 6, y + 4, 1, 1);
      rect("#222", x + 4, y + 5, 2, 1);
    } else if (c.patience > 0.3) {
      rect("#222", x + 4, y + 5, 2, 1);
    } else {
      rect("#c0392b", x + 3, y + 5, 1, 1); rect("#c0392b", x + 6, y + 5, 1, 1);
      rect("#c0392b", x + 4, y + 4, 2, 1);
      rect("#222", x + 2, y + 2, 2, 1); rect("#222", x + 6, y + 2, 2, 1);
    }
  }

  function drawTable(tx) {
    var T = R.table;
    rect(T.top, tx - 18, 60, 36, 12);
    rect(T.front, tx - 18, 72, 36, 6);
    rect(T.line, tx - 14, 64, 28, 1);
    if (R.candle) {                                // fancy candle on the pizzeria tables
      rect("#f5e6a8", tx + 11, 56, 2, 4);
      rect("#ffb020", tx + 11, 54, 2, 2);
    }
  }

  function drawOrder(c, i) {
    var tx = TABLES[i];
    rect("#222", tx - 11, 22, 22, 23);
    rect("#fff", tx - 10, 23, 20, 21);
    rect("#222", tx - 1, 45, 2, 2);
    rect("#fff", tx - 1, 45, 2, 1);
    R.dish(c.order, tx, 41);
    var color = c.patience > 0.6 ? "#6fd36f" : c.patience > 0.3 ? "#ffd24d" : "#ff6b5e";
    rect("#222", tx - 16, 79, 32, 5);
    rect("#3a2a20", tx - 15, 80, 30, 3);
    rect(color, tx - 15, 80, Math.max(0, Math.round(30 * c.patience)), 3);
  }

  function drawStation(s) {
    var T = R.counter;
    rect(T.top, s.x, 204, 48, 10);
    rect(T.front, s.x, 214, 48, 26);
    rect(T.line, s.x, 214, 48, 2);
    if (s.kind === "trash") {
      rect("#5b6571", s.x + 14, 194, 20, 3);
      rect("#7b8794", s.x + 16, 197, 16, 17);
      rect("#5b6571", s.x + 22, 200, 2, 10);
      rect("#5b6571", s.x + 26, 200, 2, 10);
    } else {
      rect(T.edge, s.x + 6, 205, 36, 8);
      rect(FOOD[s.kind], s.x + 8, 206, 32, 6);
      for (var i = 0; i < 32; i += 6) rect("rgba(255,255,255,0.3)", s.x + 9 + i, 207, 2, 2);
    }
    var name = s.kind === "trash" ? t("trash") : s.num + " " + t("f_" + s.kind);
    label(name, s.x + 24, 232, T.text);
  }

  function drawPlayer() {
    var bob = p.moving && Math.floor(p.step) % 2 ? 1 : 0;
    var legs = LEGS[p.moving ? Math.floor(p.step) % 2 : 0];
    rect("rgba(0,0,0,0.2)", p.x, p.y + 13, 10, 2);
    sprite(PLAYER_BODY.concat(legs), PLAYER_PAL, p.x, p.y - bob, p.dir < 0);
    if (tray.length) R.dish(tray, Math.round(p.x + 5), Math.round(p.y - 2 - bob));
    if (S.prompt && mode === "play" && nearest()) {
      var px = p.x < 296 ? p.x + 12 : p.x - 13;
      var py = p.y + 1 + Math.round(Math.sin(performance.now() / 150));   // gentle bounce
      rect("#1e5c2a", px, py, 11, 10);            // dark green border
      rect("#3ecf4a", px + 1, py + 1, 9, 8);      // green fill
      rect("#8dff98", px + 1, py + 1, 9, 1);      // highlight
      sprite(CHECK, { "#": "#ffffff" }, px + 2, py + 2);
    }
  }

  function drawDiner() {
    R.bg();
    customers.forEach(function (c, i) { if (c) drawCustomer(c, i); });
    TABLES.forEach(drawTable);
    customers.forEach(function (c, i) { if (c) drawOrder(c, i); });
    STATIONS.forEach(drawStation);
    drawPlayer();
    floaters.forEach(function (f) { label(f.str, f.x, f.y - (1 - f.life / 1000) * 12, f.color); });

    var info = "";
    if (mode !== "menu") {
      info = runType === "story" ? t("dayInfo", t("rs_" + storyId), dayNo) : t("endlessInfo", t("rs_" + curRid));
    }
    $("dayInfo").textContent = info;
    $("score").textContent = score;
    $("served").textContent = runType === "story" ? served + "/" + goal() : served;
    var hearts = "";
    for (var h = 0; h < Math.max(lives, 0); h++) hearts += "\u2665";
    $("lives").textContent = hearts;
  }

  // =====================================================================
  //  MAIN LOOP AND INPUT
  // =====================================================================
  function frame(now) {
    requestAnimationFrame(frame);                 // schedule the next frame first
    var dt = Math.max(0, Math.min(now - last, 50));
    last = now;
    if (now - lastFitTime > 400) { lastFitTime = now; fitScreen(); }   // keep everything inside the window
    $("quit").style.visibility = (mode === "play") ? "visible" : "hidden";
    if (mode === "play" && !paused) update(dt);   // the game freezes while settings are open
    if (mode === "scene") { updateScene(dt); drawScene(); }
    else drawDiner();
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (settingsOpen()) {                         // let buttons and checkboxes work normally
      if (k === "escape") closeSettings();
      return;
    }
    if (mode === "scene") {
      if (k === "e" || k === " " || k === "enter") {
        e.preventDefault();
        if (!e.repeat) advanceScene();
      }
      return;
    }
    if (adminOpen()) {                            // admin menu: Esc closes it
      if (k === "escape") closeAdmin();
      return;
    }
    if (mode === "menu") {
      // Typing a-d-m-i-n on the main menu unlocks the admin menu
      if (rebuild === showMenu && k.length === 1) {
        adminBuf = (adminBuf + k).slice(-5);
        if (adminBuf === "admin") {
          adminBuf = "";
          adminUnlocked = true;
          toast(t("adminOn"));
          openAdmin();
        }
      }
      return;
    }
    if (mode !== "play") return;
    if (k === "escape" || k === "p") { openSettings(); return; }
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
    keys[k] = true;
    if (!e.repeat && (k === "e" || k === " " || k === "enter")) interact();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  // =====================================================================
  //  START
  // =====================================================================
  reset();
  applyLanguage();
  showMenu();
  fitScreen();
  last = performance.now();
  requestAnimationFrame(frame);

  $("status").textContent = t("loadedOk");
  setTimeout(function () { $("status").textContent = ""; }, 3000);
</script>
</body>
</html>
